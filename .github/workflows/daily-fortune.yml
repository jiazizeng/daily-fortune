name: 每日运势生成

on:
  schedule:
    # 每天早上 7:00 (北京时间) = 前一天的 23:00 UTC
    - cron: "23 0 * * *"
  workflow_dispatch:
    # 允许手动触发

jobs:
  generate-fortune:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 运行运势生成
        run: python main.py

      - name: 提交运势报告
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 拉取远程最新以免冲突
          git pull --rebase origin main || true

          # 如果有新生成的文件则提交
          git add output/
          if git diff --cached --quiet; then
            echo "没有新的运势报告需要提交"
          else
            git commit -m "✨ 每日运势自动更新 - $(date +'%Y-%m-%d')"
            git push origin main
          fi
